<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hava Durumu</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(160deg, #0f172a, #1e3a5f);
      color: #f1f5f9;
      min-height: 100vh;
    }
    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    h1 {
      font-size: 1.4rem;
      margin: 0 0 16px;
    }
    form {
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f1f5f9;
      font-size: 1rem;
    }
    button {
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>🌤️ Hava Durumu</h1>
    <form id="form">
      <input id="q" placeholder="Şehir ara (örn. İstanbul)" autocomplete="off">
      <button>Ara</button>
    </form>
  </main>
</body>
</html>
