<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b2d">
  <meta name="description" content="Şehrindeki anlık hava durumunu ve 7 günlük tahmini öğren.">
  <title>Hava Durumu — Gökyüzü nasıl?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --ink:#f5f8fc; --muted:#9db0c3; --line:rgba(205,224,245,.13); --glass:rgba(13,37,58,.65); --accent:#a6e1dc; }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; color:var(--ink); font-family:'DM Sans',sans-serif; background:radial-gradient(ellipse at 79% 10%,#164768 0,transparent 34%),radial-gradient(ellipse at 9% 79%,#12374a 0,transparent 35%),linear-gradient(135deg,#071523,#0b2030 58%,#0a1b2a); }
    body::before { content:""; position:fixed; inset:0; opacity:.16; pointer-events:none; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.12'/%3E%3C/svg%3E"); }
    .shell { position:relative; width:min(100% - 40px,1030px); margin:auto; padding:32px 0 50px }
    header { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:38px }
    .brand { display:flex; align-items:center; gap:11px; font:700 16px Manrope,sans-serif; letter-spacing:-.3px }
    .brand-mark { width:36px; height:36px; display:grid; place-items:center; border:1px solid var(--line); border-radius:12px; background:rgba(166,225,220,.1); font-size:19px }
    .search { display:flex; width:min(370px,55vw); gap:8px; padding:5px; border:1px solid var(--line); border-radius:14px; background:rgba(5,20,33,.45); transition:border .2s }
    .search:focus-within { border-color:rgba(166,225,220,.62) }
    .search input { width:100%; min-width:0; color:var(--ink); padding:9px 11px; border:0; outline:0; background:transparent; font:500 14px 'DM Sans',sans-serif }
    .search input::placeholder { color:#8097aa }
    .search button { border:0; border-radius:10px; padding:0 15px; color:#09252c; background:var(--accent); font:700 13px 'DM Sans',sans-serif; cursor:pointer }
    main { display:grid; gap:18px }
    .hero { position:relative; min-height:330px; overflow:hidden; display:grid; grid-template-columns:1.15fr .85fr; align-items:center; padding:42px 48px; border:1px solid var(--line); border-radius:25px; background:linear-gradient(110deg,rgba(22,62,84,.78),rgba(14,40,62,.64)); box-shadow:0 24px 70px rgba(0,0,0,.14) }
    .hero::after { content:""; position:absolute; width:340px; height:340px; right:14%; top:-180px; border-radius:50%; background:rgba(137,202,204,.09); filter:blur(3px) }
    .place { color:var(--muted); font-size:15px; letter-spacing:.2px }
    h1 { margin:10px 0 0; font:600 clamp(62px,9vw,94px)/.98 Manrope,sans-serif; letter-spacing:-7px }
    .condition { margin-top:17px; font-size:19px; font-weight:500 }
    .feels { margin-top:7px; color:var(--muted); font-size:14px }
    .sky { position:relative; z-index:1; display:grid; place-items:center; min-height:210px; font-size:clamp(112px,19vw,166px); filter:drop-shadow(0 15px 24px rgba(0,0,0,.16)); animation:float 5s ease-in-out infinite }
    @keyframes float { 50% { transform:translateY(-8px) } }
    .section-head { display:flex; align-items:center; justify-content:space-between; margin:13px 2px 1px }
    h2 { margin:0; font:700 17px Manrope,sans-serif; letter-spacing:-.3px }
    .updated { color:var(--muted); font-size:12px }
    .details { display:grid; grid-template-columns:repeat(4,1fr); gap:12px }
    .detail,.forecast { border:1px solid var(--line); border-radius:17px; background:var(--glass); backdrop-filter:blur(12px) }
    .detail { min-height:116px; padding:17px 18px }
    .detail-label { display:flex; gap:8px; align-items:center; color:var(--muted); font-size:13px }
    .detail-value { margin-top:13px; font:700 23px Manrope,sans-serif; letter-spacing:-.6px }
    .forecast { display:grid; grid-template-columns:repeat(7,1fr); overflow:hidden }
    .day { display:flex; min-height:142px; flex-direction:column; align-items:center; justify-content:center; gap:11px; padding:16px 7px; border-right:1px solid var(--line); text-align:center }
    .day:last-child { border-right:0 }
    .day-name { color:var(--muted); font-size:12px }
    .day-icon { font-size:25px }
    .day-temps { display:flex; gap:8px; font-size:13px; font-weight:600 }
    .day-temps span:last-child { color:#8fa3b5 }
    .status { min-height:20px; margin:0 2px; color:#ffc7a6; font-size:13px }
    .loading .hero,.loading .detail,.loading .forecast { opacity:.6 }
    button:focus-visible,input:focus-visible { outline:2px solid #a6e1dc; outline-offset:3px }
    @media(max-width:700px) { .shell{width:min(100% - 28px,530px);padding-top:22px} header{align-items:flex-start;flex-direction:column;margin-bottom:23px}.search{width:100%}.hero{min-height:280px;padding:32px 25px;grid-template-columns:1fr .7fr}h1{letter-spacing:-5px}.sky{font-size:105px;min-height:150px}.details{grid-template-columns:repeat(2,1fr)}.forecast{grid-template-columns:repeat(7,minmax(64px,1fr));overflow-x:auto}.day{min-height:125px;padding-inline:5px}.day-temps{gap:5px;font-size:12px} }
    @media(max-width:390px) { .hero{padding:25px 19px}.sky{font-size:80px}.condition{font-size:17px}.detail{padding:14px}.detail-value{font-size:21px} }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important} }
  </style>
</head>
<body>
  <div class="shell" id="app">
    <header>
      <div class="brand"><span class="brand-mark">☼</span><span>hava<span style="color:var(--accent)">.</span>durumu</span></div>
      <form class="search" id="form" role="search">
        <input id="q" type="search" placeholder="Bir şehir ara…" aria-label="Şehir adı" autocomplete="off" required>
        <button type="submit">Ara&nbsp; ↗</button>
      </form>
    </header>
    <main aria-live="polite">
      <section class="hero" aria-label="Güncel hava durumu">
        <div><div class="place" id="place">İstanbul, Türkiye</div><h1 id="temp">—°</h1><div class="condition" id="condition">Yükleniyor…</div><div class="feels" id="feels">Hava durumu alınıyor</div></div>
        <div class="sky" id="icon" aria-hidden="true">⛅</div>
      </section>
      <div class="section-head"><h2>Bugünün ayrıntıları</h2><span class="updated" id="updated"></span></div>
      <section class="details" aria-label="Hava durumu ayrıntıları">
        <article class="detail"><div class="detail-label">💧 <span>Nem</span></div><div class="detail-value" id="humidity">—</div></article>
        <article class="detail"><div class="detail-label">💨 <span>Rüzgâr</span></div><div class="detail-value" id="wind">—</div></article>
        <article class="detail"><div class="detail-label">🌡️ <span>Hissedilen</span></div><div class="detail-value" id="detail-feels">—</div></article>
        <article class="detail"><div class="detail-label">🌧️ <span>Yağış olasılığı</span></div><div class="detail-value" id="rain">—</div></article>
      </section>
      <div class="section-head"><h2>7 günlük tahmin</h2><span class="updated">Önümüzdeki hafta</span></div>
      <section class="forecast" id="forecast" aria-label="7 günlük hava tahmini"></section>
      <p class="status" id="status" role="status"></p>
    </main>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const weather = {
      0:['Açık','☀️'],1:['Az bulutlu','🌤️'],2:['Parçalı bulutlu','⛅'],3:['Kapalı','☁️'],
      45:['Sisli','🌫️'],48:['Kırağılı sis','🌫️'],51:['Hafif çisenti','🌦️'],53:['Çisenti','🌦️'],55:['Yoğun çisenti','🌧️'],
      56:['Dondurucu çisenti','🌧️'],57:['Yoğun dondurucu çisenti','🌧️'],61:['Hafif yağmur','🌦️'],63:['Yağmur','🌧️'],65:['Kuvvetli yağmur','🌧️'],
      66:['Dondurucu yağmur','🌧️'],67:['Yoğun dondurucu yağmur','🌧️'],71:['Hafif kar','🌨️'],73:['Kar','🌨️'],75:['Yoğun kar','❄️'],77:['Kar taneleri','🌨️'],
      80:['Hafif sağanak','🌦️'],81:['Sağanak','🌧️'],82:['Kuvvetli sağanak','⛈️'],85:['Kar sağanağı','🌨️'],86:['Yoğun kar sağanağı','❄️'],
      95:['Gök gürültülü fırtına','⛈️'],96:['Dolu ihtimalli fırtına','⛈️'],99:['Kuvvetli dolulu fırtına','⛈️']
    };
    const weekdays = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
    async function loadCity(city) {
      $('status').textContent = ''; $('app').classList.add('loading');
      try {
        const geoUrl = new URL('https://geocoding-api.open-meteo.com/v1/search');
        geoUrl.search = new URLSearchParams({name:city,count:'1',language:'tr',format:'json'});
        const geoResponse = await fetch(geoUrl);
        if (!geoResponse.ok) throw new Error('Şehir araması şu anda yanıt vermiyor.');
        const geo = await geoResponse.json();
        if (!geo.results?.length) throw new Error('Bu şehir bulunamadı. Yazımı kontrol edip tekrar dene.');
        const loc = geo.results[0];
        const params = new URLSearchParams({latitude:loc.latitude,longitude:loc.longitude,current:'temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m',daily:'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max',timezone:'auto',forecast_days:'7'});
        const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
        if (!response.ok) throw new Error('Hava durumu servisine ulaşılamadı. Biraz sonra tekrar dene.');
        const data = await response.json(), now = data.current, code = weather[now.weather_code] || ['Bilinmeyen durum','🌤️'];
        $('place').textContent = [loc.name,loc.admin1,loc.country].filter((v,i,a)=>v&&a.indexOf(v)===i).join(', ');
        $('temp').textContent = `${Math.round(now.temperature_2m)}°`;
        $('condition').textContent = code[0]; $('icon').textContent = code[1];
        $('feels').textContent = `Hissedilen ${Math.round(now.apparent_temperature)}°`;
        $('detail-feels').textContent = `${Math.round(now.apparent_temperature)}°`;
        $('humidity').textContent = `${now.relative_humidity_2m}%`;
        $('wind').textContent = `${Math.round(now.wind_speed_10m)} km/sa`;
        $('rain').textContent = `${data.daily.precipitation_probability_max[0] ?? 0}%`;
        $('updated').textContent = `Güncelleme ${new Intl.DateTimeFormat('tr-TR',{hour:'2-digit',minute:'2-digit',timeZone:data.timezone}).format(new Date())}`;
        $('forecast').innerHTML = data.daily.time.map((date,i)=>{
          const day = new Date(`${date}T12:00:00`), label = i===0?'Bugün':i===1?'Yarın':weekdays[day.getDay()], icon = weather[data.daily.weather_code[i]]?.[1] || '🌤️';
          return `<article class="day"><span class="day-name">${label}</span><span class="day-icon" aria-hidden="true">${icon}</span><div class="day-temps"><span>${Math.round(data.daily.temperature_2m_max[i])}°</span><span>${Math.round(data.daily.temperature_2m_min[i])}°</span></div></article>`;
        }).join('');
        localStorage.setItem('weather-city', loc.name);
      } catch (error) { $('status').textContent = error.message || 'Bir hata oluştu. Lütfen tekrar dene.'; }
      finally { $('app').classList.remove('loading'); }
    }
    $('form').addEventListener('submit',e=>{e.preventDefault();const city=$('q').value.trim();if(city)loadCity(city);});
    loadCity(localStorage.getItem('weather-city') || 'İstanbul');
  </script>
</body>
</html>
